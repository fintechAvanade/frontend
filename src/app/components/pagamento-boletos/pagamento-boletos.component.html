<div class="boleto_container">
    <header class="boleto_header">
        <h1>Pagamento de Boletos</h1>
        <p>Os números estão próximos ao código de barras.</p>
    </header>
    <div class="boleto_content">
        <section class="saldo_contend">
            <app-saldo></app-saldo>
        </section>

        <div class="boleto_dados_content">
            <div class="boleto_body">
                <p>Informe os dados do boleto</p>
            </div>

            <div class="boleto_input">
                <label for="codigo-boleto">Código de barras:</label>
                <input id="codigo-boleto" type="text" placeholder="Digite o código de barras"
                    [(ngModel)]="codigoBoleto" />
            </div>

            <div class="boleto_input">
                <label for="descricao">Descrição:</label>
                <input id="descricao" type="text" placeholder="Digite a descrição" [(ngModel)]="descricaoBoleto" />
            </div>

            <div class="boleto_input">
                <label for="valor">Valor do Boleto:</label>
                <input id="valor" type="number" placeholder="Digite o valor do boleto" [(ngModel)]="valorBoleto" />
            </div>

            <div class="botao_pagar">
                <button (click)="confirmarPagamento()">Pagar</button>
            </div>
        </div>
    </div>
    <!-- Saldo -->

</div>
