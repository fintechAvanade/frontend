<div class="navbar_container">
    <div class="navbar_itens_primarios">
        <img class="navbar_imagem" src="assets/logo 512x120.png" alt="Logo do NULL BANK" />
        <ul class="navbar_itens">
            <div class="navbar_item" routerLink="/cliente">
                <i class="ph ph-house"></i>
                <li>Home</li>
            </div>
            <div class="navbar_item" routerLink="/cliente/extrato">
                <i class="ph ph-scroll"></i>
                <li>Extrato</li>
            </div>
            <ul>
                <div class="navbar_item" (click)="mostrarOpcoes()">
                    <i class=" ph ph-arrows-left-right"></i>
                    <li>Transações</li>
                    <i *ngIf="!mostrar" class="ph ph-caret-up"></i>
                    <i *ngIf="mostrar" class="ph ph-caret-down"></i>
                </div>
                <div class="navbar_dropdown_itens" *ngIf="mostrar">
                    <li class="navbar_dropdown_item" routerLink="/cliente/deposito">Depósito</li>
                    <li class="navbar_dropdown_item" routerLink="/cliente/saque">Saque</li>
                    <li class="navbar_dropdown_item" routerLink="/cliente/transferencia">Transferência</li>
                    <li class="navbar_dropdown_item" routerLink="/cliente/pix">Pix</li>
                    <li class="navbar_dropdown_item" routerLink="/cliente/boleto">Pagamento de boleto</li>
                </div>
            </ul>
        </ul>
    </div>
    <div class="navbar_itens_finais">
        <ul>
            <div class="navbar_item" (click)="sair()">
                <i class="ph ph-sign-out"></i>
                <li>Sair</li>
            </div>
        </ul>
    </div>

</div>
